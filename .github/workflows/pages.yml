name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh deploy/build-pages.sh
      - name: Check the Vercel build against the Java-generated site
        run: |
          node deploy/build-vercel.mjs
          grep -q 'Cellar Studio' build/pages/index.html
          grep -q 'CSV compatibility checks' build/pages/guard.html
          grep -q 'Cellar Studio' build/vercel/index.html
          grep -q 'CSV compatibility checks' build/vercel/guard.html
          diff -r --exclude='*.html' build/pages build/vercel
          for page in demo.html guide.html walkthrough.html workplace.html; do
            # The account menu uses the Vercel account API.
            sed -e '/<meta http-equiv="Content-Security-Policy"/d' \
              -e '\|^  <link rel="stylesheet" href="\./account-menu\.css">$|d' \
              -e '\|^  <script type="module" src="\./account-menu\.js"></script>$|d' \
              "build/vercel/$page" | diff "build/pages/$page" -
          done
      - name: Test the browser checker and shared site styles
        run: node --test deploy/guard-engine.test.mjs deploy/theme.test.mjs deploy/site-assistant.test.mjs
      - name: Verify catalog navigation and responsive layouts
        run: |
          python -m pip install playwright==1.56.0
          python -m http.server 8186 --bind 127.0.0.1 --directory build/vercel > /tmp/catalog-http.log 2>&1 &
          CHROME_BIN="$(command -v google-chrome)" python .github/scripts/check-catalog.py
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
