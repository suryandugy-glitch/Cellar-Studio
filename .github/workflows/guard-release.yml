name: Build and publish Cellar Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guard-release.yml'
      - 'Build.java'
      - 'scripts/package-guard*.sh'
      - 'release/**'
      - 'docs/GUARD_*.md'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/guard-release.yml'
      - 'Build.java'
      - 'scripts/package-guard*.sh'
      - 'release/**'
      - 'docs/GUARD_*.md'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Java tests
        run: java Build.java test
      - name: Package the Java ZIP
        run: bash scripts/package-guard.sh
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install --yes nsis
      - name: Package Windows x64 executable
        run: bash scripts/package-guard-windows.sh
      - name: Get release version
        id: version
        run: |
          version="$(java -jar dist/cellar.jar --version)"
          printf 'version=%s\n' "${version#Cellar Guard }" >> "$GITHUB_OUTPUT"
      - name: Upload Java ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cellar-guard-java
          path: |
            dist/Cellar-Guard-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: cellar-guard-windows-x64
          path: |
            dist/Cellar-Guard-Windows-x64.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

  windows-smoke:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cellar-guard-windows-x64
      - name: Launch the bundled app and exercise the demo and CSV checker
        shell: pwsh
        run: |
          $file = 'Cellar-Guard-Windows-x64.exe'
          $expected = ((Get-Content SHA256SUMS-Windows.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expected) { throw 'Windows executable checksum mismatch' }
          $app = Start-Process (Join-Path $PWD $file) -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(90000)) { Stop-Process -Id $app.Id -Force; throw 'Desktop launch timed out' }
          if ($app.ExitCode -ne 0) { throw "Desktop verification failed with exit code $($app.ExitCode)" }

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [package, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cellar-guard-java
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cellar-guard-windows-x64
          path: dist
      - name: Publish a dedicated Cellar Guard release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="guard-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt && sha256sum -c SHA256SUMS-Windows.txt)
          gh release create "$tag" \
            "dist/Cellar-Guard-${VERSION}.zip" dist/SHA256SUMS.txt \
            dist/Cellar-Guard-Windows-x64.exe dist/SHA256SUMS-Windows.txt \
            --title "Cellar Guard ${VERSION} — Windows desktop and Java ZIP" \
            --notes-file docs/GUARD_RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
